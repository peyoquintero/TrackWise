name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trackwise:ci .
      - name: Smoke test container
        run: |
          docker run -d --name tw -p 3000:3000 trackwise:ci
          for i in $(seq 1 20); do curl -fs localhost:3000/api/health && exit 0; sleep 2; done
          docker logs tw
          exit 1
